[package]
name = "autostart_demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "Windowless CLI demonstrating gpui-autostart: status, enable, disable and verify"

[dependencies]
# The published GPUI Kit release supplies the application shell and the GPUI
# types. The autostart crate must be built against the same GPUI, so the flavor
# features below select one GPUI for both.
gpui-kit = { version = "0.8", default-features = false }
gpui-autostart = { path = "../..", default-features = false }
anyhow = "1"
dirs = "7"

[features]
default = ["gpui-kit"]
# GPUI Kit's `gpui-pre` snapshot, the default backend.
gpui-kit = ["gpui-autostart/gpui-kit"]
# GPUI Fast. It replaces the default backend, so it replaces the flavor
# feature too: build it with `--no-default-features --features gpui-fast`.
gpui-fast = ["gpui-autostart/gpui-fast", "gpui-kit/gpui-fast"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }
