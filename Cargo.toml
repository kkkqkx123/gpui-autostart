[package]
name = "gpui-autostart"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native auto-start (launch at login) integration for GPUI apps"
repository = "https://github.com/longbridge/gpui-autostart"
keywords = ["gpui", "autostart", "desktop", "launch"]
categories = ["gui"]
readme = "README.md"

# This crate is an independent repository, not a gpui-kit workspace member.
[workspace]

[features]
default = ["gpui"]
# Select exactly one GPUI flavor; `lib.rs` rejects any other combination.
gpui = ["dep:gpui"]
gpui-kit = ["dep:gpui-kit-backend"]
gpui-ce = ["dep:gpui-ce-backend"]

[dependencies]
# Upstream GPUI (Zed). The revision is the snapshot `gpui-pre 0.3.9` was taken
# from, so all three flavors share one GPUI API generation.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed.git", rev = "93d745668805029476e6d7fbb19652116fed51de", default-features = false, optional = true }
# These packages also name their Rust library `gpui`, so use explicit aliases.
# Pin the exact snapshot gpui-kit 0.8.0 locks: a caret requirement would drift
# applications onto a snapshot their `gpui::App` was not compiled against.
gpui-kit-backend = { package = "gpui-pre", version = "=0.3.9", default-features = false, optional = true }
gpui-ce-backend = { package = "gpui-ce", version = "0.3.0", default-features = false, optional = true }
dirs = "7"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSError",
    "NSString",
    "alloc",
] }
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "SMAppService",
    "objc2",
    "objc2-foundation",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[dev-dependencies]
# The example resolves its platform through whichever GPUI flavor is selected.
gpui-kit = { version = "0.8", default-features = false }
static_assertions = "1.1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "93d745668805029476e6d7fbb19652116fed51de", features = [
    "wayland",
    "x11",
] }
gpui_ce_platform = { version = "0.3", features = ["wayland", "x11"] }

[target.'cfg(not(target_os = "linux"))'.dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "93d745668805029476e6d7fbb19652116fed51de" }
gpui_ce_platform = "0.3"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
