[package]
name = "gpui-autostart"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native auto-start (launch at login) integration for GPUI apps"
repository = "https://github.com/longbridge/gpui-autostart"
keywords = ["gpui", "autostart", "desktop", "launch"]
categories = ["gui"]
readme = "README.md"

# This crate is an independent repository, not a gpui-kit workspace member.
[workspace]
members = ["examples/autostart_demo"]

[features]
default = ["gpui-kit"]
# Select exactly one GPUI flavor; `lib.rs` rejects any other combination.
gpui-kit = ["dep:gpui-kit-backend"]
gpui-fast = ["dep:gpui-fast-backend"]

[dependencies]
# These packages also name their Rust library `gpui`, so use explicit aliases.
# Pin the exact snapshot gpui-kit 0.8.1 locks: a caret requirement would drift
# applications onto a snapshot their `gpui::App` was not compiled against.
gpui-kit-backend = { package = "gpui-pre", version = "=0.3.10", default-features = false, optional = true }
gpui-fast-backend = { package = "gpui-fast", version = "0.1.12", default-features = false, optional = true }
dirs = "7"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSError",
    "NSString",
    "alloc",
] }
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "SMAppService",
    "objc2",
    "objc2-foundation",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[dev-dependencies]
static_assertions = "1.1"
tempfile = "3"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
